- id: whisenant-2021-clarification
  type: abstract
  year: 2021
  month: 5
  title: A clarification of rabbit shoulder musculature for teaching functional anatomy
  authors:
    - Whisenant, Jacki
    - Kufner, Aaron
    - Hartman, Scott A.
  journal: The FASEB Journal
  venue: Experimental Biology 2021 (online)
  volume: 35
  issue: S1
  doi: 10.1096/fasebj.2021.35.s1.03747
  themes: [anatomy]
  abstract: >-
    In instructional anatomy labs across the country, we see an increased use of rabbits in place of
    cats due to availability for teaching comparative anatomy, and as a result, the number of
    resources supporting rabbit anatomy education is on the rise. A common discrepancy in many
    sources requires a deeper investigation of both the physical anatomy and the historical
    literature regarding certain scapular muscles. A thin, superficial muscle overlies and
    completely covers the supraspinatus in rabbits and various other mammals, and as such has often
    been misidentified as the supraspinatus. We present clarification of this muscle in the rabbit
    as a rising model for anatomical education.

