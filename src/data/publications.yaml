- id: hendrickx-2015-overview
  type: article
  year: 2015
  title: An overview of non-avian theropod discoveries and classification
  authors:
    - Hendrickx, Christophe
    - Hartman, Scott A.
    - Mateus, Octávio
  journal: PalArch's Journal of Vertebrate Palaeontology
  volume: 12
  issue: 1
  pages: 1–73
  pdf: https://www.researchgate.net/publication/281112957_An_overview_of_non-avian_theropod_discoveries_and_classification
  themes: [anatomy]
  abstract: >-
    Theropods form a taxonomically and morphologically diverse group of dinosaurs that include
    extant birds. Inferred relationships between theropod clades are complex and have changed
    dramatically over the past thirty years with the emergence of cladistic techniques. Here, we
    present a brief historical perspective of theropod discoveries and classification, as well as an
    overview on the current systematics of non-avian thero-pods. The first scientifically recorded
    theropod remains dating back to the 17th and 18th centuries come from the Middle Jurassic of
    Oxfordshire and most likely belong to the megalosaurid Megalosaurus. The latter was the first
    theropod genus to be named in 1824, and subsequent theropod material found before 1850 can all
    be referred to megalosauroids. In the fifty years from 1856 to 1906, theropod remains were
    reported from all continents but Antarctica. The clade Theropoda was erected by Othniel Charles
    Marsh in 1881, and in its current usage corresponds to an intricate ladder-like organi-zation of
    ‘family’ to ‘superfamily’ level clades. The earliest definitive theropods come from the Carnian
    of Argentina, and coelophysoids form the first significant theropod radiation from the Late
    Triassic to their extinction in the Early Jurassic. Most subsequent theropod clades such as
    ceratosaurs, allosauroids, tyrannosauroids, ornithomimosaurs, therizinosaurs, oviraptorosaurs,
    dromaeosaurids, and troodontids persisted until the end of the Cretaceous, though the
    megalosauroid clade did not extend into the Maas-trichtian. Current debates are focused on the
    monophyly of deinonychosaurs, the posi-tion of dilophosaurids within coelophysoids, and
    megaraptorans among neovenatorids. Some recent analyses have suggested a placement of
    dilophosaurids outside Coelo-physoidea, Megaraptora within Tyrannosauroidea, and a paraphyletic
    Deinonychosauria with troodontids placed more closely to avialans than dromaeosaurids.

- id: conway-2013-all
  type: book
  year: 2013
  title: "All Yesterdays: unique and speculative views of dinosaurs and other prehistoric animals"
  authors:
