# ─────────────────────────────────────────────────────────────────────────────
# PUBLICATIONS — every paper, chapter, book, thesis, and conference abstract.
#
# Easiest way to add a paper that has a DOI (fetches everything from Crossref):
#     npm run add-paper -- 10.7717/peerj.7247
# Add --selected to feature it on the home page, --theme flight (or physiology,
# anatomy) to file it under a research area, and --news to post a News item.
#
# Talks and posters (no DOI needed):  npm run add-talk   (it asks you questions)
#
# To add one by hand, copy an entry below and edit it. Fields:
#   id        unique; becomes the URL /publications/<id>/   (lastname-year-word)
#   type      article | chapter | book | thesis | preprint | abstract
#   format    talk | poster   (optional, for type: abstract)
#   year, month (month optional)
#   title     *asterisks* make italics (use for taxon names)
#   authors   one per line, "Family, Given"
#   journal / book / venue / school / publisher, volume, issue, pages
#   doi       bare DOI, e.g. 10.7717/peerj.7247
#   url       landing page (only needed when there is no DOI)
#   pdf       link to a free PDF, if you have one
#   themes    any of: flight, physiology, anatomy
#   selected  true → shown under "Selected publications" on the home page
#   caption   caption for the figure, if you drop an image named <id>.jpg/.png
#             into src/assets/publications/
#   abstract  optional; shown on the paper's own page
#
# Order doesn't matter — the site sorts by date. Newest-first is just tidier.
# ─────────────────────────────────────────────────────────────────────────────

