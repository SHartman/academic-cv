- id: hartman-2019-new
  type: article
  year: 2019
  month: 7
  title: A new paravian dinosaur from the Late Jurassic of North America supports a late acquisition of avian flight
  authors:
    - Hartman, Scott
    - Mortimer, Mickey
    - Wahl, William R.
    - Lomax, Dean R.
    - Lippincott, Jessica
    - Lovelace, David M.
  journal: PeerJ
  volume: 7
  pages: e7247
  doi: 10.7717/peerj.7247
  themes: [flight, anatomy]
  selected: true
  caption: "Figure 4: Primary blocks of WYDICE-DML-001."
  abstract: >-
    The last two decades have seen a remarkable increase in the known diversity of basal avialans
    and their paravian relatives. The lack of resolution in the relationships of these groups
    combined with attributing the behavior of specialized taxa to the base of Paraves has clouded
    interpretations of the origin of avialan flight. Here, we describe *Hesperornithoides miessleri*
    gen. et sp. nov., a new paravian theropod from the Morrison Formation (Late Jurassic) of
    Wyoming, USA, represented by a single adult or subadult specimen comprising a partial, well-
    preserved skull and postcranial skeleton. Limb proportions firmly establish *Hesperornithoides*
    as occupying a terrestrial, non-volant lifestyle. Our phylogenetic analysis emphasizes extensive
    taxonomic sampling and robust character construction, recovering the new taxon most
    parsimoniously as a troodontid close to *Daliansaurus*, *Xixiasaurus*, and *Sinusonasus*.
    Multiple alternative paravian topologies have similar degrees of support, but proposals of basal
    paravian archaeopterygids, avialan microraptorians, and Rahonavis being closer to Pygostylia
    than archaeopterygids or unenlagiines are strongly rejected. All parsimonious results support
    the hypothesis that each early paravian clade was plesiomorphically flightless, raising the
    possibility that avian flight originated as late as the Late Jurassic or Early Cretaceous.

- id: snively-2019-lower
  type: article
  year: 2019
  month: 2
  title: Lower rotational inertia and larger leg muscles indicate more rapid turns in tyrannosaurids than in other large theropods
  authors:
    - Snively, Eric
    - O’Brien, Haley
    - Henderson, Donald M.
    - Mallison, Heinrich
    - Surring, Lara A.
    - Burns, Michael E.
    - Holtz, Thomas R.
    - Russell, Anthony P.
    - Witmer, Lawrence M.
    - Currie, Philip J.
    - Hartman, Scott A.
    - Cotton, John R.
  journal: PeerJ
  volume: 7
  pages: e6432
  doi: 10.7717/peerj.6432
  pdf: https://peerj.com/articles/6432.pdf
  themes: [anatomy]
  caption: "Figure 1: Methods for digitizing body outlines and calculating mass properties, for “maximum tail width” estimate for *Tyrannosaurus rex*."
  abstract: >-
    Tyrannosaurid dinosaurs had large preserved leg muscle attachments and low rotational inertia
    relative to their body mass, indicating that they could turn more quickly than other large
    theropods. To compare turning capability in theropods, we regressed agility estimates against
    body mass, incorporating superellipse-based modeled mass, centers of mass, and rotational
    inertia (mass moment of inertia). Muscle force relative to body mass is a direct correlate of
    agility in humans, and torque gives potential angular acceleration. Agility scores therefore
    include rotational inertia values divided by proxies for (1) muscle force (ilium area and
    estimates of m. caudofemoralis longus cross-section), and (2) musculoskeletal torque.
    Phylogenetic ANCOVA (phylANCOVA) allow assessment of differences in agility between
    tyrannosaurids and non-tyrannosaurid theropods (accounting for both ontogeny and phylogeny). We
    applied conditional error probabilities a(*p*) to stringently test the null hypothesis of equal
    agility. Tyrannosaurids consistently have agility index magnitudes twice those of allosauroids
    and some other theropods of equivalent mass, turning the body with both legs planted or pivoting
    over a stance leg. PhylANCOVA demonstrates definitively greater agilities in tyrannosaurids, and
    phylogeny explains nearly all covariance. Mass property results are consistent with those of
    other studies based on skeletal mounts, and between different figure-based methods (our main
    mathematical slicing procedures, lofted 3D computer models, and simplified graphical double
    integration). The capacity for relatively rapid turns in tyrannosaurids is ecologically
    intriguing in light of their monopolization of large (>400 kg), toothed dinosaurian predator
    niches in their habitats.

