- id: chotard-2025-information
  type: article
  year: 2025
  month: 4
  title: "New information on the hind limb feathering, soft tissues and skeleton of *Microraptor* (Theropoda: Dromaeosauridae)"
  authors:
    - Chotard, Matthieu
    - Wang, Xiaoli
    - Zheng, Xiaoting
    - Kaye, Thomas G.
    - Grosmougin, Maxime
    - Barlow, Luke
    - Kundrát, Martin
    - Dececchi, T. Alexander
    - Habib, Michael B.
    - Zariwala, Juned
    - Hartman, Scott A.
    - Xu, Xing
    - Pittman, Michael
  journal: BMC Ecology and Evolution
  volume: 25
  issue: 1
  pages: 37
  doi: 10.1186/s12862-025-02372-0
  themes: [flight, anatomy]
  abstract: >-
    *Microraptor* is known as the most significant example of extended feathering on the legs of a
    paravian, both fossil and modern. Its striking difference with most paravians contributes to the
    multiple theories on the function of its conspicuous hind limbs. Recent studies tried to uncover
    its evolutionary significance, but its anatomy has only been described from a small number of
    samples. Through the analysis of 16 specimens of *Microraptor*, including 8 previously
    undescribed specimens, here we provide new information on the structure and number of hindwing
    feathers within a revised feather taxonomy, including a revised shape of the hindwing
    *Microraptor* which displays feathers all along the hind limb, except along its pedal digits.
    Here we describe in detail 6 feather types: metatarsal remiges, long metatarsal coverts, long
    femoral feathers as well as the first description of long tibial feathers, anterior coverts and
    minor coverts. Our study of specimens BMNHC PH881 and STM 5–5, 5–75, 6–62 and 6–86 is partially
    consistent with previous work, but the key difference in this study is a proximal shift of the
    triangular wing portion formed by the long tibial feathers and the long metatarsal coverts that
    outlines the joint between the tibiotarsus and metatarsus. This configuration does not exist in
    any extant or fossil bird, or in any other non-avian paravian described so far, underscoring the
    uniqueness of *Microraptor*. Unlike previous reconstructions, here the long metatarsal coverts
    display an asymmetrical close-vanned structure as in the metatarsal remiges. The feathers as
    preserved are posteriorly projected along the metatarsus and vary between medioposterior and
    lateroposterior projection along the tibial feathers. The overall configuration of feather
    layers is only found in *Microraptor*, and the two layers of elongated and asymmetrically vaned
    feathers linked to the metatarsus are more reminiscent of the forewing of modern birds than of
    any leg in other fossils and modern taxa. These new observations allow us to better understand
    the flight, non-flight locomotion and hunting strategies of this iconic ‘four-winged’ dinosaur
    suggesting *Microraptor* had a complex behaviour that made it adapted to arboreal and
    terrestrial habitats.

- id: hartman-2022-mechanistic
  type: article
  year: 2022
  month: 11
  title: Mechanistic Thermal Modeling of Late Triassic Terrestrial Amniotes Predicts Biogeographic Distribution
  authors:
    - Hartman, Scott A.
    - Lovelace, David M.
    - Linzmeier, Benjamin J.
    - Mathewson, Paul D.
    - Porter, Warren P.
  journal: Diversity
  volume: 14
  issue: 11
  pages: 973
  doi: 10.3390/d14110973
  themes: [physiology]
  selected: true
  abstract: >-
    The biogeography of terrestrial amniotes is controlled by historical contingency interacting
    with paleoclimate, morphology and physiological constraints to dispersal. Thermal tolerance is
    the intersection between organismal requirements and climate conditions which constrains modern
    organisms to specific locations and was likely a major control on ancient tetrapods. Here, we
    test the extent of controls exerted by thermal tolerance on the biogeography of 13 Late Triassic
    tetrapods using a mechanistic modeling program, Niche Mapper. This program accounts for heat and
    mass transfer into and out of organisms within microclimates. We model our 13 tetrapods in four
    different climates (cool and warm at low and high latitudes) using environmental conditions that
    are set using geochemical proxy-based general circulation models. Organismal conditions for the
    taxa are from proxy-based physiological values and phylogenetic bracketing. We find that thermal
    tolerances are a sufficient predictor for the latitudinal distribution of our 13 test taxa in
    the Late Triassic. Our modeled small mammaliamorph can persist at high latitudes with nocturnal
    activity and daytime burrowing but large pseudosuchians are excluded because they cannot seek
    nighttime shelter in burrows to retain elevated body temperatures. Our work demonstrates
    physiological modeling is useful for quantitative testing of the thermal exclusion hypothesis
    for tetrapods in deep time.

- id: pittman-2022-preserved
  type: article
  year: 2022
  month: 11
  title: Preserved soft anatomy confirms shoulder-powered upstroke of early theropod flyers, reveals enhanced early pygostylian upstroke, and explains early sternum loss
  authors:
    - Pittman, Michael
    - Kaye, Thomas G.
    - Wang, Xiaoli
    - Zheng, Xiaoting
    - Dececchi, T. Alexander
    - Hartman, Scott A.
  journal: Proceedings of the National Academy of Sciences
  volume: 119
  issue: 47
  pages: e2205476119
  doi: 10.1073/pnas.2205476119
  themes: [flight, anatomy]
  selected: true
  abstract: >-
    Anatomy of the first flying feathered dinosaurs, modern birds and crocodylians, proposes an
    ancestral flight system divided between shoulder and chest muscles, before the upstroke muscles
    migrated beneath the body. This ancestral flight system featured the dorsally positioned
    deltoids and supracoracoideus controlling the upstroke and the chest-bound pectoralis
    controlling the downstroke. Preserved soft anatomy is needed to contextualize the origin of the
    modern flight system, but this has remained elusive. Here we reveal the soft anatomy of the
    earliest theropod flyers preserved as residual skin chemistry covering the body and delimiting
    its margins. These data provide preserved soft anatomy that independently validate the ancestral
    theropod flight system. The heavily constructed shoulder and more weakly constructed chest in
    the early pygostylian *Confuciusornis* indicated by a preserved body profile, proposes the first
    upstroke-enhanced flight stroke. Slender ventral body profiles in the early-diverging birds
    *Archaeopteryx* and *Anchiornis* suggest habitual use of the pectoralis could not maintain the
    sternum through bone functional adaptations. Increased wing-assisted terrestrial locomotion
    potentially accelerated sternum loss through higher breathing requirements. Lower expected
    downstroke requirements in the early thermal soarer *Sapeornis* could have driven sternum loss
    through bone functional adaption, possibly encouraged by the higher breathing demands of a
    *Confuciusornis*-like upstroke. Both factors are supported by a slender ventral body profile.
    These data validate the ancestral shoulder/chest flight system and provide insights into novel
    upstroke-enhanced flight strokes and early sternum loss, filling important gaps in our
    understanding of the appearance of modern flight.

- id: hartman-2021-operationalizing
  type: abstract
  year: 2021
  month: 4
  title: Operationalizing a late origin of avian flight
  authors:
    - Hartman, Scott A.
    - Fitch, Adam
  venue: Northeast Natural History Conference (online)
  themes: [flight]
  review: The old conference page (eaglehill.us/NENHC_2021) is gone, so the link was removed.
  abstract: >-
    Investigations into the origin of avian flight typically center around well known taxa with
    either historical importance, such as Archaeopteryx, and/or exceptional preservation, such as
    the dromaeosaurid Microraptor. These investigations often link the origins of avian flight to
    unknown Middle Jurassic theropods, equating pennaceous-feathered wings, which first appear in
    pennaraptoran theropods in the late Middle Jurassic, with flight ability. Biomechanical work has
    shown that aerial locomotion requires far more than flapping wings, and several recent
    phylogenetic studies have concluded that incipient aerial locomotion in Archaeopteryx and
    Microraptor was acquired independently of the origin of modern birds. As the origin of avian
    flight shifts crownward, time-calibrated paravian phylogenies suggest aerial locomotion truly
    ancestral to avian flight may have been a Late Jurassic or Early Cretaceous phenomenon. This
    raises the possibility that rather than modeling hypothetical ancestral theropods, the stages of
    avian flight mechanics may be found among the exceptionally well-documented Early Cretaceous
    avialan fossil record. Here we present initial results, mapping key features associated with
    avian flight onto Early Cretaceous avialans. We find evidence for several stages of aerial
    locomotion restricted to Euavialae, with the fundamental components of the avian flight
    apparatus only becoming fully present in Ornithothoraces.

- id: lovelace-2020-modeling
  type: article
  year: 2020
  month: 5
  title: "Modeling Dragons: using linked mechanistic physiological and microclimate models to explore environmental, physiological, and morphological constraints on the early evolution of dinosaurs"
  authors:
    - Lovelace, David M.
    - Hartman, Scott A.
    - Mathewson, Paul D.
    - Linzmeier, Benjamin J.
    - Porter, Warren P.
  journal: PLOS ONE
  volume: 15
  issue: 5
  pages: e0223872
  doi: 10.1371/journal.pone.0223872
  themes: [physiology]
  selected: true
  caption: Figure 11. Comparison of daily temperature curves for Varanus and Coelophysis (uninsulated).
  abstract: >-
    We employed the widely-tested biophysiological modeling software, Niche Mapper™ to investigate
    the metabolic function of the Late Triassic dinosaurs Plateosaurus and Coelophysis during global
    greenhouse conditions. We tested a variety of assumptions about resting metabolic rate, each
    evaluated within six microclimate models that bound paleoenvironmental conditions at 12° N
    paleolatitude, as determined by sedimentological and isotopic proxies for climate within the
    Chinle Formation of the southwestern United States. Sensitivity testing of metabolic variables
    and simulated “metabolic chamber” analyses support elevated “ratite-like” metabolic rates and
    intermediate “monotreme-like” core temperature ranges in these species of early saurischian
    dinosaur. Our results suggest small theropods may have needed partial to full epidermal
    insulation in temperate environments, while fully grown prosauropods would have likely been heat
    stressed in open, hot environments and should have been restricted to cooler microclimates such
    as dense forests or higher latitudes and elevations. This is in agreement with the Late Triassic
    fossil record and may have contributed to the latitudinal gap in the Triassic prosauropod
    record.

