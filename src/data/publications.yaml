    - Kosemen, C. M.
    - Naish, Darren
  contribution: Skeletal diagrams by Scott Hartman
  publisher: Irregular Books
  themes: [anatomy]
  caption: Cover
  abstract: >-
    All Yesterdays is a book about the way we see dinosaurs and other prehistoric animals. Lavishly
    illustrated with over sixty original artworks, All Yesterdays aims to challenge our notions of
    how prehistoric animals looked and behaved. As a critical exploration of palaeontological art,
    All Yesterdays asks questions about what is probable, what is possible, and what is commonly
    ignored. Written by palaeozoologist Darren Naish, and palaeontological artists John Conway and
    C.M. Kosemen, All Yesterdays is scientifically rigorous and artistically imaginative in its
    approach to fossils of the past - and those of the future.

- id: hartman-2012-investigating
  type: abstract
  year: 2012
  title: Investigating the impact of competing interpretations of pectoral girdle placement and appendicular function on sauropod head height
  authors:
    - Hartman, Scott A.
  journal: Journal of Vertebrate Paleontology
  venue: Society of Vertebrate Paleontology Annual Meeting
  volume: 32
  issue: suppl.
  pages: 106
  review: The Google Drive PDF link from the old site now requires sign-in (private or deleted). Re-share it and add pdf back if you like.
  themes: [anatomy]
  caption: Competing models of pectoral girdle placement impact torso volume and orientation.
  abstract: >-
    Previous attempts to reconstruct the posture and potential range of motion in the cervical
    series of sauropod dinosaurs have focused on restoring the osteological neutral position (ONP)
    of the axial column, as well as attempts to link ONP with the degree of habitual vertebral
    flexion observed in extant vertebrates (Stevens & Parrish, 2005; Taylor et al, 2009). While
    placement of the pectoral girdle has been examined in depth (e.g. Bonnan et al., 2005), the roll
    of differing interpretations of appendicular posture has been largely ignored. To evaluate the
    impact of competing functional interpretations of the pectoral girdle and appendicular skeleton,
    a quantitative analysis was conducted on the three most commonly used interpretations of
    pectoral girdle placement in the literature, and several models of limb kinematics. Testing was
    carried out on a 3D digital data set of Camarasaurus, as well as dimensionally-accurate skeletal
    diagrams of Camarasaurus and several other neosauropods to increase taxonomic sampling. Results
    show that differing interpretations of the angle of the scapula on the body had a minimal impact
    on the elevation of the presacral column, while the location of the pectoral girdle had a
    significant impact, with more ventrally and posteriorly located pectoral girdles leading to
    progressively higher head height. Published interpretations of forelimb posture in sauropods
    vary mostly in the orientation of the humerus and the degree of eversion in the elbow (e.g.
    Bonnan, 2003). Neither was found to have a significant impact on head height. Hind limb
    kinematics were found to have a larger impact on head height, as knee and ankle flexure reduced
    pelvic height, which in turn raised the cervical series. Differences in restoring the pes of
    sauropods differ markedly, from digitigrade to plantigrade; lowering the foot into a plantigrade
    stance was found to increase head height. These findings demonstrate that restoring the axial
    column alone is insufficient to accurately estimate head height in sauropods. Competing
    interpretations of pectoral girdle position and hind limb kinematics can influence the angle of
    the cervical series significantly, suggesting that a more holistic approach must be taken with
    regard to sauropod neck posture.

- id: ryan-2010-new
  type: chapter
  year: 2010
  title: A new chasmosaurine ceratopsid from the Judith River Formation, Montana
  authors:
    - Ryan, Michael J.
    - Russell, Anthony P.
    - Hartman, Scott A.
  book: "New Perspectives on Horned Dinosaurs: The Royal Tyrrell Museum Ceratopsian Symposium"
  publisher: Indiana University Press
  pages: 181–188
  pdf: https://www.academia.edu/download/31218454/Medusaceratops_lokii.pdf
  themes: [anatomy]
  caption: "FIGURE 12.2. *Medusaceratops lokii* parietals. (A) Dorsal and (B) ventral right parietal ramus, WDC-DJR-001; (C) ventral and (D) dorsal left parietal process P1, WDC-DJR-002. Inset is a reconstruction of the frill based on WDC-DJR-001. Pl-3: parietal processes #1-3; SQC: squamosal contact. Scale bar is 10 cm."
  abstract: >-
    A new chasmosaurine ceratopsid, *Medusaceratops lokii*, is described based on material collected
    from a bonebed in the Judith River Formation (Campanian) near Havre, Montana. Originally, all
    ceratopsid material from the bonebed was referred to the basal centrosaurine *Albertaceratops*
    Ryan 2007, the holotype of which was collected from the Oldman Formation of Alberta, Canada.
    Reassessment of several key features of parietals from the Montanan bonebed, including the
    number and shape of the preserved epiparietals, necessitates referral of at least some material
    from this site to the new taxon. Although the bonebed does include centrosaurine elements
    (including a lateral parietal ramus and a squamosal) that may eventually be referable to
    *Albertaceratops*, it appears to be dominated by elements of chasmosaurine affinity. In addition
    to being the first unequivocal occurrence of a Campanian-aged chasmosaurine ceratopsid in
    Montana, *Medusaceratops lokii* is also the oldest known Chasmosaurine ceratopsid (approximately
    77.5 Ma).

- id: mayr-2007-tenth
  type: article
  year: 2007
  month: 1
  title: The tenth skeletal specimen of *Archaeopteryx*
  authors:
    - MAYR, GERALD
    - POHL, BURKHARD
    - HARTMAN, SCOTT
    - PETERS, D. STEFAN
  journal: Zoological Journal of the Linnean Society
  volume: 149
  issue: 1
  pages: 97-116
  doi: 10.1111/j.1096-3642.2006.00245.x
  themes: [flight, anatomy]
  caption: Figure 4. *Archaeopteryx siemensii* Dames, 1897, Thermopolis specimen (WDC-CSG-100). Skull. A, Ultraviolet-induced fluorescence photograph. B, Interpretative drawing. C, Stereo pair.
  abstract: >-
    We describe the tenth skeletal specimen of the Upper Jurassic Archaeopterygidae. The almost
    complete and well-preserved skeleton is assigned to *Archaeopteryx siemensii* Dames, 1897 and
    provides significant new information on the osteology of the Archaeopterygidae. As is evident
    from the new specimen, the palatine of *Archaeopteryx* was tetraradiate as in non-avian
    theropods, and not triradiate as in other avians. Also with respect to the position of the
    ectopterygoid, the data obtained from the new specimen lead to a revision of a previous
    reconstruction of the palate of *Archaeopteryx*. The morphology of the coracoid and that of the
    proximal tarsals is, for the first time, clearly visible in the new specimen. The new specimen
    demonstrates the presence of a hyperextendible second toe in *Archaeopteryx*. This feature is
    otherwise known only from the basal avian *Rahonavis* and deinonychosaurs (Dromaeosauridae and
    Troodontidae), and its presence in *Archaeopteryx* provides additional evidence for a close
    relationship between deinonychosaurs and avians. The new specimen also shows that the first toe
    of *Archaeopteryx* was not fully reversed but spread medially, supporting previous assumptions
    that *Archaeopteryx* was only facultatively arboreal. Finally, we comment on the taxonomic
    composition of the Archaeopterygidae and conclude that *Archaeopteryx bavarica* Wellnhofer, 1993
    is likely to be a junior synonym of *A. siemensii*, and *Wellnhoferia grandis* Elzanowski, 2001
    a junior synonym of *A. lithographica* von Meyer, 1861.

