- id: lovelace-2007-morphology
  type: article
  year: 2007
  title: Morphology of a specimen of *Supersaurus* (Dinosauria, Sauropoda) from the Morrison Formation of Wyoming, and a re-evaluation of diplodocid phylogeny
  authors:
    - Lovelace, David M.
    - Hartman, Scott A.
    - Wahl, William R.
  journal: Arquivos do Museu Nacional, Rio de Janeiro
  volume: 65
  issue: 4
  pages: 527–544
  pdf: https://www.researchgate.net/profile/David_Lovelace2/publication/237468705_Morphology_of_a_specimen_of_Supersaurus_Dinosauria_Sauropoda_from_the_Morrison_Formation_of_Wyoming_and_a_re-evaluation_of_diplodocid_phylogeny/links/00b7d5282430699e62000000/Morphology-of-a-specimen-of-Supersaurus-Dinosauria-Sauropoda-from-the-Morrison-Formation-of-Wyoming-and-a-re-evaluation-of-diplodocid-phylogeny.pdf
  themes: [anatomy]
  caption: Figure 15. Multiple view skeletal reconstruction used to guide the construction of a physical model for volumetric measurements used in mass estimate.
  abstract: >-
    A new specimen of *Supersaurus vivianae* is described, providing additional information about
    the osteology of *Supersaurus*. The single *Supersaurus* individual that the WDC quarry produced
    allows a reexamination of elements referred to *Supersaurus* from the Dry Mesa quarry. The
    osteology supports maintaining the generic distinction of *Supersaurus*. Phylogenetic evaluation
    finds a monophyletic Apatosaurinae containing [*Apatosaurus* + *Supersaurus*] + *Suuwassea*, and
    a monophyletic Diplodocinae containing [*Diplodocus* + *Seismosaurus*] + *Barosaurus*, although
    the generic distinction of *Seismosaurus* is not supported in the current analysis.

