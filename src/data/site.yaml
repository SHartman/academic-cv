name: Scott Hartman
fullName: Scott A. Hartman, PhD

# Shown under your name on the home page, and in search-engine metadata.
descriptor: Paleobiologist & vertebrate paleontologist
position: Instructional Faculty III
department: Department of Biology
institution: University of Wisconsin–Madison

# The paragraph next to the cladogram on the home page.
statement: >-
  I study how vertebrates work, from the anatomy and physiology of
  dinosaurs in general to the origin of avian flight, using phylogenetics,
  biomechanics, and mechanistic physiological models.

# Used for highlighting your name in author lists ("Hartman SA"), and for "me"
# when you run  npm run add-talk.
self:
  family: Hartman
  givenInitial: S
  citeAs: Hartman, Scott A.

email: sahartman@wisc.edu

# Buttons under the statement, in this order. Remove a line to hide it.
