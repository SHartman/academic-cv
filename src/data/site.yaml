  - { label: Google Scholar, href: "https://scholar.google.com/citations?user=C28Tm0QAAAAJ" }
  - { label: ORCID, href: "https://orcid.org/0000-0002-7276-4419" }
  - { label: GitHub, href: "https://github.com/SHartman" }
  - { label: ResearchGate, href: "https://www.researchgate.net/profile/Scott-Hartman" }

outreachSite: https://www.skeletaldrawing.com

# Whole-section switches.
features:
